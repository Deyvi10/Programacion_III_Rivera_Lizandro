<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escala Interactiva - Plataforma de Cursos</title>
    <script src="dom08-mouse-touch_mp.js" defer></script>
</head>

<body>
    <h2>Previsualización de Recursos del Curso</h2>
    <h2>Escala por Arraste Horizontal</h2>

    <!-- Cuarto ejemplo -->
    <div id="contenedorTriangulo"
        style="position:relative; 
        width:100%; 
        height:300px; 
        margin-top:20px; 
        background:whitesmoke;">

        <div id="triangulo" style="
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 100px solid darkcyan;
            position: absolute;
            top: 100px;
            left: calc(50% - 50px);
            cursor: ew-resize;">
        </div>
    </div>

</body>

</html>
