<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Mecánico - Redimensionar Herramienta</title>
    <script src="dom08-mouse-touch_mp.js" defer></script>
</head>

<body>
    <h2>Taller Mecánico</h2>
    <h2>Redimensionar Herramienta</h2>

    <div id="contenedorHerramienta"
        style="position:relative; 
        width:100%; 
        height:300px; 
        margin-top:20px; 
        background:whitesmoke;">

        <div id="herramienta" style="
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 100px solid crimson;
            position: absolute;
            top: 100px;
            left: calc(50% - 50px);
            transition: transform 0.2s ease;">
        </div>
    </div>

</body>

</html>
