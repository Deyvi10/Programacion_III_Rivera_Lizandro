<!DOCTYPE html>

<head>

<body>
    <h2>Panel de Cursos Online</h2>
    <h2>Evento Mouse Move</h2>

    <!-- Tercero ejemplo -->
    <h2>Evento Mouse Enter y Mouse Leave</h2>
    <div style="margin-top:20px;">
        <button id="botonAnimado" style="padding:10px 20px; 
       font-size:18px; 
       transition: all 0.3s;

       border: none;
       border-radius: 5px;
       cursor: pointer;">
            ¡Explora los cursos o pasa el mouse!</button>
