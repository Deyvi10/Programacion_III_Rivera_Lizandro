<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulacion de DOM</title>
    <script scr="dom04-eventos.js" defer></script>
    <style>
        .boton {
            background-color: brown;
            padding: 0%.5em 1em;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1 id="titulo">Eventos del DOM</h1>
    <h2 onclick="alert('Hello Dom')">Eventos Inline</h2>
    <button class="boton" id="btn"
         onclick="mostrarAlerta()">
         Mostrar Alerta
    </button>

    <button class="boton2" id="btn2" 
        onclick="agregarProducto()">
        Agregar producto
    </button>
    <ul id="lista-productos1"></ul>

    <button class="boton" id="btn3">
        Agregar producto desde Listener
    </button>
    <ul id="lista-productos2"></ul>
</body>

</html>
