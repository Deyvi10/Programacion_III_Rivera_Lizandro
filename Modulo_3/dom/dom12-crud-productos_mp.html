<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Gestión de Cursos Online</title>
    <script src="dom12-crud-productos_mp.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h2 {
            color: black;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: aliceblue;
        }

        tr {
            background-color: antiquewhite;
        }

        tr:nth-child(even) {
            background-color: azure;
        }

        .formulario {
            background-color: aquamarine;
            border: 1px solid #b0fce8;
            padding: 20px;
            margin-top: 20px;
        }

        .formulario input {
            width: 200px;
            padding: 5px;
            margin-bottom: 8px;
        }

        .btn-agregar:hover {
            background-color: rgb(8, 104, 72);
            color: white;
        }

        .stat-card {
            display: inline-block;
            width: 200px;
            padding: 15px;
            margin: 10px;
            background-color: aquamarine;
            border: 1px solid #b0fce8;
            border-radius: 5px;
            text-align: center;
        }

        .stat-card h3 {
            margin: 0;
            color: black;
        }
    </style>
</head>

<body>

    <h1 id="titulo">Gestión de Cursos Online</h1>
    <h2>Inventario de Recursos del Curso</h2>
    <div id="stats">
        <div class="stat-card">
            <h3>Total Recursos</h3>
            <p id="totalProductos">0</p>
        </div>

        <div class="stat-card">
            <h3>Costo Promedio</h3>
            <p id="precioPromedio">0</p>
        </div>
        <div class="stat-card">
            <h3>Recurso Más Caro</h3>
            <p id="productoMasCaro">N/A</p>
        </div>
        <div class="stat-card">
            <h3>Recurso Más Barato</h3>
            <p id="productoMasBarato">N/A</p>
        </div>
    </div>
    
    <div class="formulario">
        <h3>Agregar nuevo recurso</h3>
        <label for="nombre">Nombre:</label>
        <input id="nombre" type="text" placeholder="Nombre del recurso">
        <br>
        <label for="descripcion">Descripción:</label>
        <input id="descripcion" type="text" placeholder="Descripción del recurso">
        <br>
        <label for="precio">Costo:</label>
        <input id="precio" type="number" placeholder="Costo del recurso">
        <br>
        <button id="btn_agregar" class="btn-agregar">Agregar Producto</button>
        <button id="btn_cancelar" class="btn-cancelar">Cancelar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Costo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">

        </tbody>
    </table>

</body>

</html>
