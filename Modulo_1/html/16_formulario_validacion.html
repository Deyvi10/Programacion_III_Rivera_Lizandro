<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewpoint" content="width-device-width, initial-scale=1.0">
    <title>Enlaces</title>
</head>


<body>
    <h1>Formulario con validación</h1>
    <form action="/procesar" method="post">

        <fieldset>
            <legend>Campo obligatorio</legend>
            <label for="nombre">Nombre</label><br>
            <input type="text" id="nombre" name="nombre" required><br>
        </fieldset>
        <fieldset>

            <legend>Minlenght / Maxlength</legend>
            <label for="apellido">Apellido</label><br>
            <input type="text" id="apellido" name="apellido" min="18" max="99"><br>

        </fieldset>

        <fieldset>
            <legend>Patron de caracteres - expresion regular</legend>
            <label for="codigo_postal">Codigo postal</label><br>
            <input type="text" id="codigo_postal" name="codigo_postal" pattern="[0-9]{5}"><br>
        </fieldset>

        <fieldset>
            <legend>min / max rango para números</legend>
            <label for="edad">Edad</label><br>
            <input type="number" id="edad" name="edad" min="18" max="99"><br>
        </fieldset>

        <fieldset>
            <legend>Deshabilitado</legend>
            <label for="ref">Referencia</label><br>
            <input type="text" id="ref" name="ref" value="REF-001" disabled><br>
        </fieldset>

        <fieldset>
            <legend>Solo lectura</legend>
            <label for="pais">Pais</label><br>
            <input type="pais" id="pais" name="pais" value="Ecuador" readonly><br>
        </fieldset>

        <br>
        <button type="submit">Enviar</button> <!--envia el formulario-->

    </form>
</body>

</html>
